<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ESP32 Climate Monitor</title>
    <style>
      :root {
        --bg: #eef3f4;
        --surface: #fff;
        --ink: #14282e;
        --muted: #5c7178;
        --accent: #0b7a75;
        --track: #d5e2e4;
        --warn: #b3261e;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1b1f;
          --surface: #16282d;
          --ink: #e6f1f2;
          --muted: #8fa7ad;
          --accent: #4fd1c5;
          --track: #274047;
          --warn: #ff8a80;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1b1f;
        --surface: #16282d;
        --ink: #e6f1f2;
        --muted: #8fa7ad;
        --accent: #4fd1c5;
        --track: #274047;
        --warn: #ff8a80;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        min-height: 100vh;
      }
      main {
        max-width: 30rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      .clock {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .clock b {
        font-size: 1.6rem;
        color: var(--ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .temp {
        margin: 2.5rem 0 1.5rem;
        text-align: center;
      }
      .temp .v {
        font-size: 6.5rem;
        line-height: 1;
        font-weight: 300;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }
      .temp .u {
        font-size: 2rem;
        color: var(--accent);
        margin-left: 0.15rem;
        font-weight: 500;
      }
      .temp small {
        display: block;
        margin-top: 0.5rem;
        color: var(--muted);
      }
      .card {
        background: var(--surface);
        border-radius: 1rem;
        padding: 1.1rem 1.25rem;
        margin-bottom: 1rem;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .row span {
        color: var(--muted);
      }
      .row strong {
        font-size: 1.5rem;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        height: 0.6rem;
        background: var(--track);
        border-radius: 1rem;
        margin-top: 0.8rem;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 1rem;
        transition: width 0.6s;
      }
      .btns {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 0.8rem;
        padding: 0.9rem 1rem;
        cursor: pointer;
        flex: 1;
      }
      #connect {
        background: var(--accent);
        color: var(--bg);
      }
      #unit {
        flex: 0 0 auto;
        background: var(--surface);
        color: var(--ink);
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      #status {
        text-align: center;
        color: var(--muted);
        margin-top: 1rem;
        min-height: 1.4em;
      }
      #status.err {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="clock"><span id="date"></span><b id="time"></b></div>

      <div class="temp">
        <div>
          <span class="v" id="temp">--</span><span class="u" id="tu">°C</span>
        </div>
        <small id="updated">Not connected</small>
      </div>

      <div class="card">
        <div class="row">
          <span>Humidity</span><strong id="hum">-- %</strong>
        </div>
        <div class="bar"><i id="humbar"></i></div>
      </div>
      <div class="card">
        <div class="row">
          <span>Heat Index</span><strong id="feels">--</strong>
        </div>
      </div>
      <div class="card">
        <div class="row">
          <span>Soil moisture</span><strong id="soil">-- %</strong>
        </div>
        <div class="bar"><i id="soilbar"></i></div>
      </div>

      <div class="btns">
        <button id="connect">Connect to ESP32</button>
        <button id="unit" aria-label="Switch temperature unit">°C / °F</button>
      </div>
      <p id="status" role="status"></p>
    </main>

    <script>
      const SERVICE = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
      const CHAR = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
      const $ = (id) => document.getElementById(id);
      let useF = false,
        last = null,
        device = null;

      function tick() {
        const n = new Date();
        $("time").textContent = n.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
          second: "2-digit",
        });
        $("date").textContent = n.toLocaleDateString([], {
          weekday: "long",
          month: "short",
          day: "numeric",
        });
      }
      setInterval(tick, 1000);
      tick();

      const cToF = (c) => (c * 9) / 5 + 32;
      function render() {
        if (!last) return;
        const t = useF ? cToF(last.c) : last.c;
        $("temp").textContent = t.toFixed(1);
        $("tu").textContent = useF ? "°F" : "°C";
        $("hum").textContent = Math.round(last.h) + " %";
        $("humbar").style.width = Math.min(100, Math.max(0, last.h)) + "%";
        if (last.s !== undefined) {
          $("soil").textContent = Math.round(last.s) + " %";
          $("soilbar").style.width = Math.min(100, Math.max(0, last.s)) + "%";
        }
        const f = useF ? last.hi : ((last.hi - 32) * 5) / 9;
        $("feels").textContent = f.toFixed(1) + (useF ? " °F" : " °C");
        $("updated").textContent =
          "Updated " +
          last.at.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
          });
      }

      function onData(e) {
        // ESP32 sends "tempC,humidity,heatIndexF"
        const p = new TextDecoder()
          .decode(e.target.value)
          .split(",")
          .map(Number);
        if (p.length < 2 || p.some(isNaN)) return;
        last = {
          c: p[0],
          h: p[1],
          hi: p[2] ?? cToF(p[0]),
          s: p[3],
          at: new Date(),
        };
        render();
      }

      function setStatus(msg, err) {
        $("status").textContent = msg;
        $("status").className = err ? "err" : "";
      }

      function onDisconnect() {
        $("connect").textContent = "Connect to ESP32";
        setStatus("Disconnected. Tap to reconnect.", true);
      }

      async function connect() {
        if (!navigator.bluetooth) {
          setStatus(
            "This browser has no Web Bluetooth. Use Chrome on Android or desktop (not iPhone).",
            true,
          );
          return;
        }
        try {
          setStatus("Choose your ESP32 in the pairing window…");
          device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE] }],
          });
          device.addEventListener("gattserverdisconnected", onDisconnect);
          setStatus("Connecting…");
          const server = await device.gatt.connect();
          const svc = await server.getPrimaryService(SERVICE);
          const ch = await svc.getCharacteristic(CHAR);
          ch.addEventListener("characteristicvaluechanged", onData);
          await ch.startNotifications();
          $("connect").textContent = "Disconnect";
          setStatus(
            "Connected to " +
              (device.name || "ESP32") +
              ". Readings arrive every 3 seconds.",
          );
        } catch (err) {
          setStatus(
            err.name === "NotFoundError"
              ? "No device selected."
              : "Could not connect: " + err.message,
            true,
          );
        }
      }

      $("connect").onclick = () => {
        if (device && device.gatt.connected) {
          device.gatt.disconnect();
        } else {
          connect();
        }
      };
      $("unit").onclick = () => {
        useF = !useF;
        render();
      };
    </script>
  </body>
</html>
